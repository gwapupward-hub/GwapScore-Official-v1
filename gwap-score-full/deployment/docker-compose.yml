version: "3.8"

services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: gwapscore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gwapscore}
      POSTGRES_USER: ${DB_USER:-gwapscore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gwapscore_user} -d ${DB_NAME:-gwapscore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gwapscore-network

  # GwapScore API
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: gwapscore-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gwapscore}
      DB_USER: ${DB_USER:-gwapscore_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gwapscore-network

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: gwapscore-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - gwapscore-network

volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local
  # redis_data:
  #   driver: local

networks:
  gwapscore-network:
    driver: bridge
