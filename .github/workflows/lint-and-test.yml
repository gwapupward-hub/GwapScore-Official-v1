name: Lint and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: gwap-score-full/package-lock.json

      - name: Install dependencies
        working-directory: gwap-score-full
        run: npm ci

      - name: Run ESLint
        working-directory: gwap-score-full
        run: npm run lint

      - name: Run TypeScript type checking
        working-directory: gwap-score-full
        run: npx tsc --noEmit

      - name: Run composite reputation regression tests
        working-directory: gwap-score-full
        run: npx jest __tests__/composite-reputation.test.ts --runInBand
