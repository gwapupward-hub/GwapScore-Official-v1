name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gwap-score-full/package-lock.json

      - name: Install dependencies
        working-directory: gwap-score-full
        run: npm ci

      - name: Run ESLint
        working-directory: gwap-score-full
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gwapscore_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gwap-score-full/package-lock.json

      - name: Install dependencies
        working-directory: gwap-score-full
        run: npm ci

      - name: Setup database
        working-directory: gwap-score-full
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U test_user -d gwapscore_test -f database/schema.sql

      - name: Run tests and v2 scoring coverage gate
        working-directory: gwap-score-full
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gwapscore_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          JWT_SECRET: test_secret_for_ci
        run: npm test -- --coverage --config jest.v2-coverage.config.js

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: gwap-score-full/coverage/coverage-final.json
          flags: gwapscore-v2
          name: gwapscore-v2-critical

  build:
    name: Build TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gwap-score-full/package-lock.json

      - name: Install dependencies
        working-directory: gwap-score-full
        run: npm ci

      - name: Build TypeScript
        working-directory: gwap-score-full
        run: npm run build

      - name: Check for build errors
        working-directory: gwap-score-full
        run: test -d dist

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: gwap-score-full
          file: gwap-score-full/deployment/Dockerfile
          push: false
          tags: gwapscore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: gwap-score-full
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'gwap-score-full'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # Example: ssh deploy@staging "cd /app && docker-compose pull && docker-compose up -d"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker, security]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment script here
          # Example: ssh deploy@production "cd /app && docker-compose pull && docker-compose up -d"
